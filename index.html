<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gifts Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0d0d0d;
            color: #fff;
            padding: 15px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
        }
        .balance {
            font-size: 20px;
            font-weight: bold;
        }
        .balance span { color: #f5a623; }
        .promo-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .promo-section input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 15px;
            min-width: 150px;
        }
        .promo-section button {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            background: #2a2a2a;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .promo-section button:active { transform: scale(0.95); }
        #promo-message {
            font-size: 14px;
            margin-bottom: 10px;
            min-height: 20px;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .case-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid #2a2a2a;
            transition: 0.2s;
        }
        .case-card:active { transform: scale(0.97); }
        .case-card .emoji { font-size: 40px; }
        .case-card .name { font-weight: bold; margin: 8px 0; font-size: 16px; }
        .case-card .price { color: #f5a623; font-size: 14px; margin-bottom: 10px; }
        .btn-open {
            background: linear-gradient(135deg, #f5a623, #f7c948);
            border: none;
            color: #000;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-open:active { transform: scale(0.95); }
        .btn-open:disabled { opacity: 0.4; cursor: not-allowed; }
        .inventory-section {
            border-top: 1px solid #222;
            padding-top: 15px;
            margin-top: 10px;
        }
        .inventory-section h3 { margin-bottom: 10px; font-size: 18px; }
        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .inv-item {
            background: #1a1a1a;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #333;
            font-size: 14px;
        }
        .rarity-common { border-color: #666; }
        .rarity-rare { border-color: #3b82f6; }
        .rarity-epic { border-color: #a855f7; }
        .rarity-legendary { border-color: #ff6b6b; color: #ff6b6b; }
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        #modal .box {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 30px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }
        #modal .box .big-emoji { font-size: 60px; margin-bottom: 10px; }
        #modal .box .item-name { font-size: 22px; font-weight: bold; margin: 8px 0; }
        #modal .box .item-rarity { font-size: 14px; margin-bottom: 15px; }
        #modal .box .btn-close {
            background: #f5a623;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        @media (max-width: 400px) {
            .cases-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size:18px;">🎁 Gifts Battle</div>
    <div class="balance">⭐️ <span id="balance-display">0</span></div>
</div>

<div class="promo-section">
    <input type="text" id="promo-input" placeholder="Введіть промокод...">
    <button onclick="applyPromo()">Активувати</button>
</div>
<div id="promo-message"></div>

<div class="cases-grid" id="cases-container"></div>

<div class="inventory-section">
    <h3>🎒 Мій інвентар</h3>
    <div class="inventory-grid" id="inventory-container">
        <span style="color:#666;">Завантаження...</span>
    </div>
</div>

<div id="modal">
    <div class="box">
        <div class="big-emoji" id="modal-emoji">🎁</div>
        <div class="item-name" id="modal-name">Назва</div>
        <div class="item-rarity" id="modal-rarity">Рідкість</div>
        <button class="btn-close" onclick="closeModal()">Отримано!</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const USER_ID = tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 999999);
    const API_URL = 'https://lolz-6.onrender.com';
    let currentBalance = 0;

    async function fetchAPI(url, options = {}) {
        const res = await fetch(API_URL + url, options);
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Помилка');
        }
        return res.json();
    }

    async function loadUser() {
        try {
            const data = await fetchAPI(`/api/user/${USER_ID}`);
            currentBalance = data.stars_balance || 0;
            document.getElementById('balance-display').textContent = currentBalance;
            renderInventory(data.inventory || []);
            return data;
        } catch (e) {
            console.error('loadUser error', e);
            document.getElementById('inventory-container').innerHTML = '<span style="color:#666;">Помилка завантаження</span>';
        }
    }

    async function loadCases() {
        try {
            const cases = await fetchAPI('/api/cases');
            const container = document.getElementById('cases-container');
            container.innerHTML = cases.map(c => `
                <div class="case-card">
                    <div class="emoji">🎁</div>
                    <div class="name">${c.name}</div>
                    <div class="price">⭐️ ${c.price_stars > 0 ? c.price_stars : 'FREE'}</div>
                    <button class="btn-open" onclick="openCase(${c.id})">Відкрити</button>
                </div>
            `).join('');
        } catch (e) {
            console.error('loadCases error', e);
        }
    }

    async function openCase(caseId) {
        const promo = document.getElementById('promo-input').value.trim();
        const url = `/api/cases/open/${caseId}?telegram_id=${USER_ID}` + (promo ? `&promo_code=${promo}` : '');
        try {
            const data = await fetchAPI(url, { method: 'POST' });
            showResult(data.item);
            updateBalance(data.balance);
            await loadUser();
            if (data.promo_used) {
                document.getElementById('promo-message').innerHTML = '✅ Промокод активовано!';
                document.getElementById('promo-message').style.color = '#4ade80';
                document.getElementById('promo-input').value = '';
            }
        } catch (e) {
            alert(e.message || 'Помилка відкриття кейсу');
        }
    }

    function updateBalance(balance) {
        currentBalance = balance;
        document.getElementById('balance-display').textContent = balance;
    }

    function renderInventory(inventory) {
        const container = document.getElementById('inventory-container');
        if (!inventory || inventory.length === 0) {
            container.innerHTML = '<span style="color:#666;">Поки порожньо</span>';
            return;
        }
        container.innerHTML = inventory.map(item => `
            <div class="inv-item rarity-${item.rarity || 'common'}">
                ${item.emoji || '🎁'} ${item.name}
            </div>
        `).join('');
    }

    function showResult(item) {
        document.getElementById('modal-emoji').textContent = item.emoji || '🎁';
        document.getElementById('modal-name').textContent = item.name;
        const rarity = item.rarity || 'common';
        const labels = { common: 'Звичайний', rare: 'Рідкісний', epic: 'Епічний', legendary: 'Легендарний' };
        document.getElementById('modal-rarity').textContent = '⭐ ' + (labels[rarity] || rarity.toUpperCase());
        document.getElementById('modal-rarity').style.color = rarity === 'legendary' ? '#ff6b6b' : '#fff';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    async function applyPromo() {
        const code = document.getElementById('promo-input').value.trim();
        if (!code) {
            document.getElementById('promo-message').innerHTML = '❌ Введіть код';
            document.getElementById('promo-message').style.color = '#f87171';
            return;
        }
        try {
            const data = await fetchAPI(`/api/promo/check/${code}`);
            if (data.valid) {
                let msg = '✅ Промокод дійсний!';
                if (data.stars > 0) msg += ` +${data.stars}⭐️`;
                if (data.case_id) msg += ' Відкрийте кейс!';
                document.getElementById('promo-message').innerHTML = msg;
                document.getElementById('promo-message').style.color = '#4ade80';
            } else {
                document.getElementById('promo-message').innerHTML = '❌ Невірний або використаний';
                document.getElementById('promo-message').style.color = '#f87171';
            }
        } catch (e) {
            document.getElementById('promo-message').innerHTML = '❌ Помилка перевірки';
            document.getElementById('promo-message').style.color = '#f87171';
        }
    }

    loadUser();
    loadCases();

    setTimeout(async () => {
        try {
            const user = await fetchAPI(`/api/user/${USER_ID}`);
            if (user.stars_balance === 0 && (!user.inventory || user.inventory.length === 0)) {
                const give = await fetchAPI(`/api/user/${USER_ID}/give_stars?amount=300`, { method: 'POST' });
                updateBalance(give.balance);
                document.getElementById('promo-message').innerHTML = '🎉 Отримано 300⭐️ бонусних зірок!';
                document.getElementById('promo-message').style.color = '#f5a623';
            }
        } catch(e) {}
    }, 500);
</script>

</body>
</html>
